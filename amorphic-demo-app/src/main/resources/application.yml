server:
  port: 8080
amorphic:
  # Overridden in Docker by AMORPHIC_ADDRESSES=/config/addresses.yaml
  addresses: ../amorphic-demo-env/addresses/stage-0.yaml
  # Overridden in Docker by AMORPHIC_CATALOGUE=/env/catalogue.yaml
  catalogue: ../amorphic-demo-env/catalogue.yaml
  # The declared instances (spec 03). Overridden in Docker by AMORPHIC_INSTANCES=/env/instances.yaml
  instances: ../amorphic-demo-env/instances.yaml
  # The app's own identity, as declared there. ./demo passes demo-app-remote or demo-app-foldin;
  # demo-app-dev is the one declared for running the app from a checkout (tests, bootRun).
  instance: demo-app-dev
  # Where topologies and call records are appended. Empty keeps them in memory only.
  # Overridden in Docker by AMORPHIC_TOPOLOGY=/records/topology.jsonl
  topology: ""
  inventory:
    # Evidence records the live table needs before the inventory reports ready.
    min-evidence: 100
  governor:
    # Overridden in Docker by AMORPHIC_GOVERNOR_RULES=/env/governor-rules.yaml
    rules: ../amorphic-demo-env/governor-rules.yaml
management:
  endpoints:
    web:
      exposure:
        include: health
spring:
  main:
    banner-mode: off
