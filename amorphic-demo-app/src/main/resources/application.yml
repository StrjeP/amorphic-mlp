server:
  port: 8080
amorphic:
  # Overridden in Docker by AMORPHIC_ADDRESSES=/config/addresses.yaml
  addresses: ../amorphic-demo-env/addresses/stage-0.yaml
  # Overridden in Docker by AMORPHIC_CATALOGUE=/catalogue/catalogue.yaml
  catalogue: ../amorphic-demo-env/catalogue.yaml
  inventory:
    # Evidence records the live table needs before the inventory reports ready.
    min-evidence: 100
management:
  endpoints:
    web:
      exposure:
        include: health
spring:
  main:
    banner-mode: off
