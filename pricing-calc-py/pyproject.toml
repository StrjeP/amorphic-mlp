[project]
name = "pricing-calc"
version = "1.0.0"
description = "Incumbent pricing-calc service (amorphic MLP demo)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricing_calc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
