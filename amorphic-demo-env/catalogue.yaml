# Catalogue: every version of every capability and every piece of tooling, and where it may run.
# Static and edited by hand. The inventory reports it; the governor proposes only
# capability versions that are listed here and not withdrawn.
#
#   kind       capability: does the business work; the governor proposes its moves
#              tooling:    runs the system itself (catalogue, inventory, governor). The address table
#                          routes the inventory and governor too, but only a human moves them
#   locations  where the version may run: remote (its own service), local (in-process), file
#   service    for remote: the compose service and URL it is reachable at
#   withdrawn  set by a human, with the reason, to stop a version being proposed again
#   planned    not built yet; says when it is due
#   access     for a capability: how a remote version is reached. via: envelope means it speaks the
#              envelope (POST /invoke); via: adapter means the app wraps its plain API, as the adapter says
#
# outcomes lists what a caller can ask for (spec 04), each with its recipe: the steps that reach it.
#   steps      in order; the last step's output is the result
#   capability what the step asks for, at any rung; the routing chooses what serves it, once per plan
#   schema     the schema of the payload the step is sent
#   with       how that payload is built: field -> expression. An expression is a dotted path starting
#              with input (the outcome's input), item (the current item, in a fan-out) or an earlier
#              step's name (its output)
#   each       run the step once for each item of this list; its output is the list of results
#   pass-through  items where `when` equals `equals` are already done: they go on unchanged, no call
#
# schemas, at the end, lists the schemas the envelopes' payloads follow, each by address and file.
# The framework's own schemas (envelope, causation, error, instance) are built in and need no entry.
#
# accept-undeclared says whether an instance may answer without being declared in instances.yaml
# first. If false, routing to one is refused; if true, it is recorded as undeclared (spec 03).
accept-undeclared: false

capabilities:
  pricing-calc:
    kind: capability
    description: Converts an amount between currencies, rounded to 2 decimal places (HALF_EVEN).
    versions:
      - address: pkg:amorphic/pricing-calc@1.0?lang=python
        locations: [remote]
        service: { name: py-pricing, url: http://py-pricing:8000 }
        # The incumbent doesn't speak the envelope, so the app reaches it through an adapter, unchanged.
        access:
          via: adapter
          adapter:
            method: GET
            path: /convert
            query: { amount: amount, from: from, to: to }
            reply: { amount: amount, currency: currency }
            schema: pkg:schema/pricing-calc-convert-reply@1.0

      - address: pkg:amorphic/pricing-calc@2.0?lang=java
        locations: [remote]
        service: { name: java-pricing, url: http://java-pricing:8080 }
        access: { via: envelope }
        withdrawn: "Rounds HALF_UP; shadow caught it disagreeing with 1.0 in stage 1. Replaced by 2.1."

      - address: pkg:amorphic/pricing-calc@2.1?lang=java
        locations: [remote, local]
        service: { name: java-pricing, url: http://java-pricing:8080 }
        access: { via: envelope }

  positions:
    kind: capability
    description: An account's positions, read from accounts.yaml. Always in-process in the app.
    versions:
      - address: pkg:amorphic/positions@1.0?lang=java
        locations: [local]

  sum:
    kind: capability
    description: Adds up amounts that are all in one currency. Always in-process in the app.
    versions:
      - address: pkg:amorphic/sum@1.0?lang=java
        locations: [local]

  catalogue:
    kind: tooling
    description: This file. Every version, where it may run, and whether it is withdrawn. Edited by hand.
    versions:
      - address: pkg:amorphic/catalogue@1.0?lang=yaml
        locations: [file]

  inventory:
    kind: tooling
    description: Observes what is running now (live address table, /health of each address, /evidence) against this catalogue. Stores nothing.
    versions:
      - address: pkg:amorphic/inventory@0.1?lang=java
        # local: in-process in the demo app (the default). remote: its own service (inventory-service).
        locations: [local, remote]
        service: { name: inventory, url: http://inventory:8080 }

  governor:
    kind: tooling
    description: Applies a rule table to the inventory and proposes the next address table. A human approves.
    versions:
      - address: pkg:amorphic/governor@0.1?lang=java
        # local: in-process in the demo app (the default). remote: its own service (governor-service).
        locations: [local, remote]
        service: { name: governor, url: http://governor:8080 }

outcomes:
  - address: pkg:outcome/quote@1.0
    description: A price for an amount, in another currency.
    input: pkg:schema/quote-request@1.0
    steps:
      - name: convert
        capability: pkg:amorphic/pricing-calc
        schema: pkg:schema/pricing-calc-convert-request@1.0
        with: { amount: input.amount, from: input.from, to: input.to }

  - address: pkg:outcome/account-value@1.0
    description: What an account is worth in one currency.
    input: pkg:schema/account-value-request@1.0
    steps:
      - name: positions
        capability: pkg:amorphic/positions
        schema: pkg:schema/positions-request@1.0
        with: { account: input.account }
      - name: convert
        capability: pkg:amorphic/pricing-calc
        schema: pkg:schema/pricing-calc-convert-request@1.0
        each: positions.positions
        # A position already in the report's currency needs no conversion.
        pass-through: { when: item.currency, equals: input.currency }
        with: { amount: item.amount, from: item.currency, to: input.currency }
      - name: total
        capability: pkg:amorphic/sum
        schema: pkg:schema/sum-request@1.0
        with: { amounts: convert, currency: input.currency }

schemas:
  - address: pkg:schema/pricing-calc-convert-request@1.0
    file: schemas/pricing-calc-convert-request-1.0.json
  - address: pkg:schema/pricing-calc-convert-reply@1.0
    file: schemas/pricing-calc-convert-reply-1.0.json
  - address: pkg:schema/quote-request@1.0
    file: schemas/quote-request-1.0.json
  - address: pkg:schema/account-value-request@1.0
    file: schemas/account-value-request-1.0.json
  - address: pkg:schema/positions-request@1.0
    file: schemas/positions-request-1.0.json
  - address: pkg:schema/positions-reply@1.0
    file: schemas/positions-reply-1.0.json
  - address: pkg:schema/sum-request@1.0
    file: schemas/sum-request-1.0.json
  - address: pkg:schema/sum-reply@1.0
    file: schemas/sum-reply-1.0.json
