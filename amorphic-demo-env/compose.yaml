# One compose file for every stage. ./demo decides which services run,
# which Java version is used and whether the app is built with fold-in.
# The inventory and governor services run only when the address table binds them remote
# (./demo tooling remote); otherwise both run in-process in the app.
name: amorphic

services:
  app:
    image: amorphic/demo-app:${APP_VARIANT:-remote}
    build:
      context: ..
      dockerfile: amorphic-demo-app/Dockerfile
      args:
        FOLD_IN: ${APP_FOLD_IN:-false}
    ports: ["8080:8080"]
    environment:
      AMORPHIC_ADDRESSES: /config/addresses.yaml
      # The catalogue (read on every observation) and the governor's rules (read on every proposal),
      # so hand edits apply straight away.
      AMORPHIC_CATALOGUE: /env/catalogue.yaml
      AMORPHIC_GOVERNOR_RULES: /env/governor-rules.yaml
      # The declared instances (read whenever a table is applied) and the app's own identity in them:
      # a build without pricing-calc-core and one with it folded in are different instances.
      AMORPHIC_INSTANCES: /env/instances.yaml
      AMORPHIC_INSTANCE: demo-app-${APP_VARIANT:-remote}
      # Every call's topology is appended here, and read back when the app restarts.
      AMORPHIC_TOPOLOGY: /records/topology.jsonl
    volumes:
      # ./demo renders the active stage's address table into .run/
      - ./.run:/config:ro
      # The topology log: writable, and kept until ./demo down.
      - ./.run/records:/records
      # This directory, not single files: an editor that saves by replacing a file would leave a
      # single-file mount pointing at the old one.
      - .:/env:ro

  py-pricing:
    image: amorphic/pricing-calc-py:1.0
    build: ../pricing-calc-py
    ports: ["8000:8000"]
    environment:
      # Its identity as declared in instances.yaml. It reports it, with what it realises, on GET /meta.
      AMORPHIC_INSTANCE: py-pricing-v1.0

  java-pricing:
    # Built by ./demo: the core from the git tag pricing-calc-java/<version>, the service shell from HEAD.
    image: amorphic/pricing-calc-java:${JAVA_VERSION:-v2.1}
    ports: ["8090:8080"]
    environment:
      # Its identity as declared in instances.yaml: one per version deployed behind this URL.
      AMORPHIC_INSTANCE: java-pricing-${JAVA_VERSION:-v2.1}

  inventory:
    image: amorphic/inventory-service:0.1
    build:
      context: ..
      dockerfile: amorphic-systems/inventory-service/Dockerfile
    ports: ["8100:8080"]
    environment:
      AMORPHIC_APP_URL: http://app:8080
      AMORPHIC_CATALOGUE: /env/catalogue.yaml
    volumes:
      - .:/env:ro

  governor:
    image: amorphic/governor-service:0.1
    build:
      context: ..
      dockerfile: amorphic-systems/governor-service/Dockerfile
    ports: ["8110:8080"]
    environment:
      AMORPHIC_APP_URL: http://app:8080
      AMORPHIC_CATALOGUE: /env/catalogue.yaml
      AMORPHIC_GOVERNOR_RULES: /env/governor-rules.yaml
    volumes:
      - .:/env:ro
