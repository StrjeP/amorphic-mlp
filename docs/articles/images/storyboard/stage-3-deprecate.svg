DA" stroke-width="2" fill="none" marker-end="url(#acc)"/><text x="360" y="180" font-size="11.5" font-weight="400" fill="#57606A" text-anchor="middle">champion: served</text><text x="24" y="248" font-size="11.5" font-weight="400" fill="#57606A" text-anchor="start">Polymorphic: one remote service has replaced another, and the shape is unchanged</text></svg>
